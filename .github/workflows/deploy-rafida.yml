# Auto-deploy the SaaS (rafida VPS) on every push to the development branch.
#
# The VPS side is a restricted SSH key: its authorized_keys entry forces
# `/root/deploy-thawab.sh` (fetch → build → pm2 restart), so this key can only
# redeploy Thawab — it cannot open a shell or reach anything else on the server.
#
# Required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (optional VPS_PORT).
name: Deploy rafida (VPS)

on:
  push:
    branches: [claude/check-remaining-xwx64g]
  workflow_dispatch:

concurrency:
  group: deploy-rafida
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        id: deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::warning::VPS secrets not configured yet — skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          mkdir -p ~/.ssh
          # Normalize a key pasted from a Windows terminal (CRLF / stray spaces),
          # and also accept a single-line base64 of the key file.
          if printf '%s' "$SSH_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > ~/.ssh/id_deploy
          else
            printf '%s' "$SSH_KEY" | tr -d '\r\n ' | base64 -d > ~/.ssh/id_deploy
          fi
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a valid private key — re-copy it (or use: base64 -w0 /root/.ssh/gh_deploy)."
            exit 1
          fi
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The forced command on the server runs the deploy; no command needed.
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o BatchMode=yes "$DEPLOY_USER@$HOST"

      - name: Health check
        if: steps.deploy.outputs.configured == 'true'
        run: |
          sleep 5
          curl -fsS --max-time 30 https://radifa.jaadpro.com/api/auth-bootstrap
